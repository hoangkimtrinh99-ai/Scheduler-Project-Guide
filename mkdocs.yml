site_name: Scheduler User Guide
site_url: https://hoangkimtrinh99-ai.github.io/Scheduler-Project-Guide/
repo_url: https://github.com/hoangkimtrinh99-ai/Scheduler-Project-Guide
repo_name: Scheduler-Project-Guide

theme:
  name: material
  language: en
  logo: image/CRS_LOGO-01.png
  palette:
    - scheme: default
      primary: white
      accent: blue
  features:
    - navigation.expand
    - navigation.tracking
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

# Custom CSS
extra_css:
  - stylesheets/extra.css

# Custom JavaScript
extra_javascript:
  - javascripts/fix-navigation.js

nav:
  - Setup:
      - Pre-criteria: setup/pre-criteria.md
      - Rooms & Equipment: setup/rooms-equipment.md
      - Specialization & Skills: setup/specialization-skills.md
      - Branch Operating Hours: setup/branch-hours.md
      - Staff Shift Template: setup/staff-shift-template.md
      - Branch Room: setup/branch-room.md
      - Branch Equipment: setup/branch-equipment.md
      - Service Category: setup/service-category.md
      - Service: setup/service.md
      - Staff / Counsellors: setup/staff.md
      - Staff Schedules: setup/staff-schedules.md
  - Integration:
      - Outlook Integration (Tenant): integration/outlook-tenant.md
      - Outlook Integration (Staff): integration/outlook-staff.md
      - AI Chatbot (Staff): integration/ai-chatbot-staff.md
      - WhatsApp (Customers): integration/whatsapp-customer.md
  - Appointments:
      - Create Appointment: appointments/create-appointment.md
